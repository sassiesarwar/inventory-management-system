<!DOCTYPE html>
<html>
<head><title>Create Purchase Order</title></head>
<body>
    <h1>Create Purchase Order</h1>
    <form action="/add-purchase-order" method="POST">
        <label>Supplier:</label><br>
        <select name="supplier_id" required>
            {% for sup in suppliers %}
            <option value="{{ sup[0] }}">{{ sup[1] }}</option>
            {% endfor %}
        </select><br><br>

        <label>Product:</label><br>
        <select name="product_id" required>
            {% for prod in products %}
            <option value="{{ prod[0] }}">{{ prod[1] }}</option>
            {% endfor %}
        </select><br><br>

        <label>Quantity:</label><br>
        <input type="number" name="quantity" required><br><br>

        <label>Unit Cost:</label><br>
        <input type="number" step="0.01" name="unit_cost" required><br><br>

        <button type="submit">Create Order</button>
    </form>
    <br>
    <a href="/view-purchase-orders">View All Orders</a>
</body>
</html>
