{% extends "base.html" %}
{% block content %}
<h2>Create Purchase Order</h2>
<div class="card p-4" style="max-width: 500px;">
<form method="POST">
    <div class="mb-3"><label class="form-label">Supplier</label>
    <select name="supplier_id" class="form-select" required>
        {% for sup in suppliers %}<option value="{{ sup[0] }}">{{ sup[1] }}</option>{% endfor %}
    </select></div>
    <div class="mb-3"><label class="form-label">Product</label>
    <select name="product_id" class="form-select" required>
        {% for prod in products %}<option value="{{ prod[0] }}">{{ prod[1] }}</option>{% endfor %}
    </select></div>
    <div class="mb-3"><label class="form-label">Quantity</label>
    <input type="number" class="form-control" name="quantity" required></div>
    <div class="mb-3"><label class="form-label">Unit Cost</label>
    <input type="number" step="0.01" class="form-control" name="unit_cost" required></div>
    <button type="submit" class="btn btn-primary">Create Order</button>
</form>
</div>
{% endblock %}
