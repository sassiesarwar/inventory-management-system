{% extends "base.html" %}
{% block content %}
<h2>Create Purchase Order</h2>
<p class="text-muted mb-3">Order stock from a supplier.</p>
<div class="card p-4" style="max-width: 500px;">
<form method="POST">
    <div class="mb-3"><label class="form-label">Supplier</label>
    <select name="supplier_id" class="form-select" required>
        <option value="" disabled selected>Choose a supplier</option>
        {% for sup in suppliers %}<option value="{{ sup[0] }}">{{ sup[1] }}</option>{% endfor %}
    </select></div>
    <div class="mb-3"><label class="form-label">Product</label>
    <select name="product_id" class="form-select" required>
        <option value="" disabled selected>Choose a product</option>
        {% for prod in products %}<option value="{{ prod[0] }}">{{ prod[1] }}</option>{% endfor %}
    </select></div>
    <div class="mb-3"><label class="form-label">Quantity</label>
    <input type="number" class="form-control" name="quantity" placeholder="e.g., 50" required></div>
    <div class="mb-3"><label class="form-label">Unit Cost (Rs.)</label>
    <input type="number" step="0.01" class="form-control" name="unit_cost" placeholder="e.g., 1500" required></div>
    <button type="submit" class="btn btn-primary">Create Order</button>
    <a href="/view-purchase-orders" class="btn btn-outline-primary">Cancel</a>
</form>
</div>
{% endblock %}
