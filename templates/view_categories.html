{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Category List</h2>
    <a href="/add-category" class="btn btn-primary">+ Add New Category</a>
</div>
<table class="table table-striped table-hover shadow-sm bg-white rounded">
    <thead class="table-dark"><tr><th>ID</th><th>Name</th><th>Description</th><th>Actions</th></tr></thead>
    <tbody>
    {% for cat in categories %}
    <tr>
        <td>{{ cat[0] }}</td><td>{{ cat[1] }}</td><td>{{ cat[2] }}</td>
        <td>
            <a href="/edit-category/{{ cat[0] }}" class="btn btn-sm btn-outline-primary">Edit</a>
            <a href="/delete-category/{{ cat[0] }}" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
