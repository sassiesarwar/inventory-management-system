{% extends "base.html" %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-start">
    <div><h2>Categories</h2><p>Manage product categories</p></div>
    <a href="/add-category" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Category</a>
</div>
<table class="table table-hover">
    <thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Actions</th></tr></thead>
    <tbody>
    {% for cat in categories %}
    <tr>
        <td>{{ cat[0] }}</td><td>{{ cat[1] }}</td><td>{{ cat[2] }}</td>
        <td>
            <a href="/edit-category/{{ cat[0] }}" class="btn btn-sm btn-outline-primary">Edit</a>
            <a href="/delete-category/{{ cat[0] }}" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
