{% extends "base.html" %}
{% block content %}
<h2>Add New User</h2>
<div class="card p-4" style="max-width: 500px;">
<form method="POST">
    <div class="mb-3"><label class="form-label">Username</label>
    <input type="text" class="form-control" name="username" required></div>
    <div class="mb-3"><label class="form-label">Password</label>
    <input type="password" class="form-control" name="password" required></div>
    <div class="mb-3"><label class="form-label">Full Name</label>
    <input type="text" class="form-control" name="full_name"></div>
    <div class="mb-3"><label class="form-label">Role</label>
    <select name="role" class="form-select">
        <option value="staff">Staff</option><option value="admin">Admin</option>
    </select></div>
    <div class="mb-3"><label class="form-label">Email</label>
    <input type="email" class="form-control" name="email"></div>
    <button type="submit" class="btn btn-primary">Add User</button>
</form>
</div>
{% endblock %}
