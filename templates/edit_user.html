{% extends "base.html" %}
{% block content %}
<h2>Edit User</h2>
<div class="card p-4" style="max-width: 500px;">
<form method="POST">
    <div class="mb-3"><label class="form-label">Username</label>
    <input type="text" class="form-control" name="username" value="{{ user[1] }}" required></div>
    <div class="mb-3"><label class="form-label">Full Name</label>
    <input type="text" class="form-control" name="full_name" value="{{ user[3] }}"></div>
    <div class="mb-3"><label class="form-label">Role</label>
    <select name="role" class="form-select">
        <option value="staff" {% if user[4]=='staff' %}selected{% endif %}>Staff</option>
        <option value="admin" {% if user[4]=='admin' %}selected{% endif %}>Admin</option>
    </select></div>
    <div class="mb-3"><label class="form-label">Email</label>
    <input type="email" class="form-control" name="email" value="{{ user[5] }}"></div>
    <button type="submit" class="btn btn-primary">Update User</button>
</form>
</div>
{% endblock %}
