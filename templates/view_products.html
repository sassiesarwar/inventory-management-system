<!DOCTYPE html>
<html>
<head>
    <title>All Products</title>
</head>
<body>
    <h1>Product List</h1>
    <a href="/add-product">+ Add New Product</a>
    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>SKU</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product[0] }}</td>
            <td>{{ product[1] }}</td>
            <td>{{ product[2] }}</td>
            <td>{{ product[4] }}</td>
            <td>{{ product[5] }}</td>
<td>
    <a href="/edit-product/{{ product[0] }}">Edit</a> |
    <a href="/delete-product/{{ product[0] }}">Delete</a>
</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
