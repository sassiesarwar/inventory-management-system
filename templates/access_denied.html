<!DOCTYPE html>
<html>
<head>
    <title>Access Denied - InvenTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif; background-color: #F5F7FA; height: 100vh;
            display: flex; align-items: center; justify-content: center; margin: 0;
        }
        .denied-card {
            background: white; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 48px 40px; width: 100%; max-width: 420px; text-align: center;
        }
        .denied-icon { font-size: 3rem; color: #DC2626; margin-bottom: 12px; }
        .denied-title { font-weight: 700; font-size: 1.3rem; color: #2D3748; margin-bottom: 8px; }
        .denied-text { color: #718096; font-size: 0.92rem; margin-bottom: 24px; }
        .btn-back { background-color: #089BAB; color: white; border: none; border-radius: 8px; padding: 10px 24px; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn-back:hover { background-color: #067885; color: white; }
    </style>
</head>
<body>
    <div class="denied-card">
        <div class="denied-icon"><i class="bi bi-shield-lock"></i></div>
        <div class="denied-title">Access Denied</div>
        <div class="denied-text">This page is only available to Admin accounts. If you need access, ask your administrator to update your role.</div>
        <a href="/user/dashboard" class="btn-back">Back to My Dashboard</a>
    </div>
</body>
</html>
