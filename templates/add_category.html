{% extends "base.html" %}
{% block content %}
<h2>Add New Category</h2>
<div class="card p-4" style="max-width: 500px;">
<form method="POST">
    <div class="mb-3"><label class="form-label">Category Name</label>
    <input type="text" class="form-control" name="category_name" required></div>
    <div class="mb-3"><label class="form-label">Description</label>
    <input type="text" class="form-control" name="description"></div>
    <button type="submit" class="btn btn-primary" onclick="this.disabled=true; this.form.submit();">Add Category</button>
</form>
</div>
{% endblock %}
