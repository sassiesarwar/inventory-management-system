{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Purchase Order List</h2>
    <a href="/add-purchase-order" class="btn btn-primary">+ Create New Order</a>
</div>
<table class="table table-striped table-hover shadow-sm bg-white rounded">
    <thead class="table-dark"><tr><th>Order ID</th><th>Supplier</th><th>Product</th><th>Quantity</th><th>Status</th><th>Order Date</th></tr></thead>
    <tbody>
    {% for order in orders %}
    <tr>
        <td>{{ order[0] }}</td><td>{{ order[1] }}</td><td>{{ order[2] }}</td>
        <td>{{ order[3] }}</td>
        <td><span class="badge bg-warning text-dark">{{ order[4] }}</span></td>
        <td>{{ order[5] }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
