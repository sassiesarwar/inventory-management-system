{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h2>Settings</h2>
    <p>Manage your organization and account preferences</p>
</div>

<div class="row g-3">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="d-flex align-items-center gap-3 mb-2">
                <div class="stat-icon"><i class="bi bi-people"></i></div>
                <div>
                    <h5 class="mb-0">Users & Roles</h5>
                    <p class="text-muted mb-0" style="font-size:0.85rem;">Manage who has access to this system</p>
                </div>
            </div>
            <a href="/view-users" class="btn btn-outline-primary mt-2">Manage Users</a>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card p-4">
            <div class="d-flex align-items-center gap-3 mb-2">
                <div class="stat-icon" style="background:#F59E0B;"><i class="bi bi-building"></i></div>
                <div>
                    <h5 class="mb-0">Organization Profile</h5>
                    <p class="text-muted mb-0" style="font-size:0.85rem;">Update your company name and notification preferences</p>
                </div>
            </div>

            <form method="POST">
                <div class="mb-3 mt-2">
                    <label class="form-label">Organization Name</label>
                    <input type="text" class="form-control" name="org_name" value="{{ org_name }}" required>
                </div>

                <hr>
                <h6 class="mb-2">Notifications</h6>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" name="notify_low_stock"
                           id="notifyLowStock" {% if notify_low_stock %}checked{% endif %}>
                    <label class="form-check-label" for="notifyLowStock">
                        Notify me about low stock
                    </label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="notify_new_orders"
                           id="notifyNewOrders" {% if notify_new_orders %}checked{% endif %}>
                    <label class="form-check-label" for="notifyNewOrders">
                        Notify me about new purchase orders
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">Save Settings</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
