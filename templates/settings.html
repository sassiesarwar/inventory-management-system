{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h2>Settings</h2>
    <p>Manage your organization and account preferences</p>
</div>

<div class="row g-3">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="d-flex align-items-center gap-3 mb-2">
                <div class="stat-icon"><i class="bi bi-people"></i></div>
                <div>
                    <h5 class="mb-0">Users & Roles</h5>
                    <p class="text-muted mb-0" style="font-size:0.85rem;">Manage who has access to this system</p>
                </div>
            </div>
            <a href="/view-users" class="btn btn-outline-primary mt-2">Manage Users</a>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-4">
            <div class="d-flex align-items-center gap-3 mb-2">
                <div class="stat-icon" style="background:#F59E0B;"><i class="bi bi-building"></i></div>
                <div>
                    <h5 class="mb-0">Organization Profile</h5>
                    <p class="text-muted mb-0" style="font-size:0.85rem;">Company name: InvenTrack Electronics</p>
                </div>
            </div>
            <button class="btn btn-outline-primary mt-2" disabled>Edit Profile (Coming Soon)</button>
        </div>
    </div>
</div>
{% endblock %}
