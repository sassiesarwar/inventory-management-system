{% extends "base.html" %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-start">
    <div><h2>Users</h2><p>Manage system users and roles</p></div>
    <a href="/add-user" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add User</a>
</div>
<table class="table table-hover">
    <thead><tr><th>ID</th><th>Username</th><th>Full Name</th><th>Role</th><th>Email</th><th>Actions</th></tr></thead>
    <tbody>
    {% for u in users %}
    <tr>
        <td>{{ u[0] }}</td><td>{{ u[1] }}</td><td>{{ u[3] }}</td>
        <td><span class="badge" style="background:#DBEAFE;color:#1E40AF;">{{ u[4] }}</span></td><td>{{ u[5] }}</td>
        <td>
            <a href="/edit-user/{{ u[0] }}" class="btn btn-sm btn-outline-primary">Edit</a>
            <a href="/delete-user/{{ u[0] }}" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
