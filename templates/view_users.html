{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>User List</h2>
    <a href="/add-user" class="btn btn-primary">+ Add New User</a>
</div>
<table class="table table-striped table-hover shadow-sm bg-white rounded">
    <thead class="table-dark"><tr><th>ID</th><th>Username</th><th>Full Name</th><th>Role</th><th>Email</th><th>Actions</th></tr></thead>
    <tbody>
    {% for u in users %}
    <tr>
        <td>{{ u[0] }}</td><td>{{ u[1] }}</td><td>{{ u[3] }}</td>
        <td><span class="badge bg-info text-dark">{{ u[4] }}</span></td><td>{{ u[5] }}</td>
        <td>
            <a href="/edit-user/{{ u[0] }}" class="btn btn-sm btn-outline-primary">Edit</a>
            <a href="/delete-user/{{ u[0] }}" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
