{% extends "base.html" %}
{% block content %}
<h2>Add New Category</h2>
<p class="text-muted mb-3">Create a category to group similar products together.</p>
<div class="card p-4" style="max-width: 500px;">
<form method="POST">
    <div class="mb-3"><label class="form-label">Category Name</label>
    <input type="text" class="form-control" name="category_name" placeholder="e.g., Electronics" required></div>
    <div class="mb-3"><label class="form-label">Description</label>
    <input type="text" class="form-control" name="description" placeholder="Brief description (optional)"></div>
    <button type="submit" class="btn btn-primary">Add Category</button>
    <a href="/view-categories" class="btn btn-outline-primary">Cancel</a>
</form>
</div>
{% endblock %}
