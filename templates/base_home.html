<!DOCTYPE html>
<html>
<head>
    <title>InvenTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --teal: #089BAB;
            --teal-dark: #067885;
            --bg: #F5F7FA;
            --text: #2D3748;
            --text-light: #718096;
            --border: #E2E8F0;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; }
        h1, h2, h3 { font-weight: 600; color: var(--text); }
        
        .btn-primary { background-color: var(--teal); border-color: var(--teal); font-weight: 500; border-radius: 7px; }
        .btn-primary:hover { background-color: var(--teal-dark); border-color: var(--teal-dark); }
        .btn-outline-primary { color: var(--teal); border-color: var(--teal); border-radius: 7px; font-weight: 500; }
        .btn-outline-primary:hover { background-color: var(--teal); border-color: var(--teal); color: white; }
        
        .stat-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
        .stat-number { font-size: 1.8rem; font-weight: 700; color: var(--text); }
        .stat-label { font-size: 0.82rem; color: var(--text-light); }
        
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0;
            background: white; border-bottom: 1px solid var(--border);
            padding: 12px 40px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
        }
        .top-nav .brand {
            font-weight: 700; font-size: 1.2rem; color: var(--text);
        }
        .top-nav .brand i { color: var(--teal); }
        .top-nav .nav-links a {
            color: var(--text-light); text-decoration: none; margin-left: 24px;
            font-weight: 500; font-size: 0.9rem;
        }
        .top-nav .nav-links a:hover { color: var(--teal); }
        .top-nav .nav-links .btn-signup {
            background: var(--teal); color: white; padding: 6px 18px; 
            border-radius: 6px; text-decoration: none;
        }
        .top-nav .nav-links .btn-signup:hover { background: var(--teal-dark); color: white; }
        
        .main-content { margin-top: 70px; padding: 20px 40px; }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <div class="top-nav">
        <div class="brand">
            <i class="bi bi-box-seam-fill"></i> InvenTrack
        </div>
        <div class="nav-links">
            {% if session.get('user_id') %}
                <a href="/dashboard">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a href="/logout">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            {% else %}
                <a href="/login">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </a>
                <a href="/signup" class="btn-signup">
                    <i class="bi bi-person-plus"></i> Sign Up
                </a>
            {% endif %}
        </div>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
