{% extends "base.html" %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-start">
    <div><h2>Suppliers</h2><p>Manage your supplier list</p></div>
    <a href="/add-supplier" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Supplier</a>
</div>
<table class="table table-hover">
    <thead><tr><th>ID</th><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th>Actions</th></tr></thead>
    <tbody>
    {% for sup in suppliers %}
    <tr>
        <td>{{ sup[0] }}</td><td>{{ sup[1] }}</td><td>{{ sup[2] }}</td><td>{{ sup[3] }}</td><td>{{ sup[4] }}</td>
        <td>
            <a href="/edit-supplier/{{ sup[0] }}" class="btn btn-sm btn-outline-primary">Edit</a>
            <a href="/delete-supplier/{{ sup[0] }}" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
