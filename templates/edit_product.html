<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
</head>
<body>
    <h1>Edit Product</h1>
    <form action="/edit-product/{{ product[0] }}" method="POST">
        <label>Product Name:</label><br>
        <input type="text" name="product_name" value="{{ product[1] }}" required><br><br>

        <label>SKU/Barcode:</label><br>
        <input type="text" name="sku" value="{{ product[2] }}"><br><br>

        <label>Unit Price:</label><br>
        <input type="number" step="0.01" name="unit_price" value="{{ product[4] }}" required><br><br>

        <label>Quantity in Stock:</label><br>
        <input type="number" name="quantity_in_stock" value="{{ product[5] }}" required><br><br>

        <button type="submit">Update Product</button>
    </form>
</body>
</html>
