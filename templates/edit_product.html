{% extends "base.html" %}
{% block content %}
<h2>Edit Product</h2>
<div class="card p-4" style="max-width: 500px;">
<form method="POST">
    <div class="mb-3"><label class="form-label">Product Name</label>
    <input type="text" class="form-control" name="product_name" value="{{ product[1] }}" required minlength="3"></div>
    <div class="mb-3"><label class="form-label">SKU/Barcode</label>
    <input type="text" class="form-control" name="sku" value="{{ product[2] or '' }}"></div>
    <div class="mb-3"><label class="form-label">Description</label>
    <textarea class="form-control" name="description" rows="2">{{ product[7] or '' }}</textarea></div>
    <div class="mb-3"><label class="form-label">Unit Price (Rs.)</label>
    <input type="number" step="0.01" min="0" class="form-control" name="unit_price" value="{{ product[4] }}" required></div>
    <div class="mb-3"><label class="form-label">Quantity in Stock</label>
    <input type="number" min="0" class="form-control" name="quantity_in_stock" value="{{ product[5] }}" required></div>
    <button type="submit" class="btn btn-primary">Update Product</button>
    <a href="/view-products" class="btn btn-outline-primary">Cancel</a>
</form>
</div>
{% endblock %}
