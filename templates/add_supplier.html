{% extends "base.html" %}
{% block content %}
<h2>Add New Supplier</h2>
<div class="card shadow-sm p-4" style="max-width: 500px;">
<form method="POST">
    <div class="mb-3"><label class="form-label">Supplier Name</label>
    <input type="text" class="form-control" name="supplier_name" required></div>
    <div class="mb-3"><label class="form-label">Contact Person</label>
    <input type="text" class="form-control" name="contact_person"></div>
    <div class="mb-3"><label class="form-label">Phone</label>
    <input type="text" class="form-control" name="phone"></div>
    <div class="mb-3"><label class="form-label">Email</label>
    <input type="email" class="form-control" name="email"></div>
    <div class="mb-3"><label class="form-label">Address</label>
    <input type="text" class="form-control" name="address"></div>
    <button type="submit" class="btn btn-primary">Add Supplier</button>
</form>
</div>
{% endblock %}
