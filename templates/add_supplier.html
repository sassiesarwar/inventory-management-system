<!DOCTYPE html>
<html>
<head><title>Add Supplier</title></head>
<body>
    <h1>Add New Supplier</h1>
    <form action="/add-supplier" method="POST">
        <label>Supplier Name:</label><br>
        <input type="text" name="supplier_name" required><br><br>

        <label>Contact Person:</label><br>
        <input type="text" name="contact_person"><br><br>

        <label>Phone:</label><br>
        <input type="text" name="phone"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Address:</label><br>
        <input type="text" name="address"><br><br>

        <button type="submit">Add Supplier</button>
    </form>
    <br>
    <a href="/view-suppliers">View All Suppliers</a>
</body>
</html>
