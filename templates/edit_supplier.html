<!DOCTYPE html>
<html>
<head><title>Edit Supplier</title></head>
<body>
    <h1>Edit Supplier</h1>
    <form action="/edit-supplier/{{ supplier[0] }}" method="POST">
        <label>Supplier Name:</label><br>
        <input type="text" name="supplier_name" value="{{ supplier[1] }}" required><br><br>

        <label>Contact Person:</label><br>
        <input type="text" name="contact_person" value="{{ supplier[2] }}"><br><br>

        <label>Phone:</label><br>
        <input type="text" name="phone" value="{{ supplier[3] }}"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" value="{{ supplier[4] }}"><br><br>

        <label>Address:</label><br>
        <input type="text" name="address" value="{{ supplier[5] }}"><br><br>

        <button type="submit">Update Supplier</button>
    </form>
</body>
</html>
