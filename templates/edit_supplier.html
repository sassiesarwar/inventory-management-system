{% extends "base.html" %}
{% block content %}
<h2>Edit Supplier</h2>
<div class="card p-4" style="max-width: 500px;">
<form method="POST">
    <div class="mb-3"><label class="form-label">Supplier Name</label>
    <input type="text" class="form-control" name="supplier_name" value="{{ supplier[1] }}" required></div>
    <div class="mb-3"><label class="form-label">Contact Person</label>
    <input type="text" class="form-control" name="contact_person" value="{{ supplier[2] }}"></div>
    <div class="mb-3"><label class="form-label">Phone</label>
    <input type="text" class="form-control" name="phone" value="{{ supplier[3] }}"></div>
    <div class="mb-3"><label class="form-label">Email</label>
    <input type="email" class="form-control" name="email" value="{{ supplier[4] }}"></div>
    <div class="mb-3"><label class="form-label">Address</label>
    <input type="text" class="form-control" name="address" value="{{ supplier[5] }}"></div>
    <button type="submit" class="btn btn-primary">Update Supplier</button>
</form>
</div>
{% endblock %}
