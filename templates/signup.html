<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - InvenTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif; background-color: #F5F7FA; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; margin: 0; padding: 30px 0;
        }
        .login-card { background: white; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 40px 36px; width: 100%; max-width: 380px; }
        .login-logo { text-align: center; font-size: 2.2rem; margin-bottom: 6px; }
        .login-title { text-align: center; font-weight: 700; font-size: 1.3rem; color: #2D3748; margin-bottom: 4px; }
        .login-subtitle { text-align: center; color: #718096; font-size: 0.88rem; margin-bottom: 24px; }
        .form-control { border-radius: 8px; padding: 10px 14px; border: 1px solid #E2E8F0; margin-bottom: 14px; }
        .form-control:focus { border-color: #089BAB; box-shadow: 0 0 0 3px rgba(8, 155, 171, 0.12); }
        .btn-login { background-color: #089BAB; color: white; border: none; border-radius: 8px; padding: 10px; width: 100%; font-weight: 600; }
        .btn-login:hover { background-color: #067885; color: white; }
        .error-msg { color: #DC2626; font-size: 0.85rem; text-align: center; margin-bottom: 10px; }
        .bottom-link { text-align: center; font-size: 0.85rem; margin-top: 16px; color: #718096; }
        .bottom-link a { color: #089BAB; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">📦</div>
        <div class="login-title">Create Account</div>
        <div class="login-subtitle">Sign up to start managing inventory</div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="text" class="form-control" name="full_name" placeholder="Full Name" required>
            <input type="text" class="form-control" name="username" placeholder="Username" required>
            <input type="email" class="form-control" name="email" placeholder="Email address" required>
            <input type="password" class="form-control" name="password" placeholder="Password" required minlength="6">
            <input type="password" class="form-control" name="confirm_password" placeholder="Confirm Password" required minlength="6">
            <button type="submit" class="btn-login">Sign Up</button>
        </form>
        <div class="bottom-link">Already have an account? <a href="/login">Sign In</a></div>
    </div>
</body>
</html>
