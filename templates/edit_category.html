{% extends "base.html" %}
{% block content %}
<h2>Edit Category</h2>
<div class="card p-4" style="max-width: 500px;">
<form method="POST">
    <div class="mb-3"><label class="form-label">Category Name</label>
    <input type="text" class="form-control" name="category_name" value="{{ category[1] }}" required></div>
    <div class="mb-3"><label class="form-label">Description</label>
    <input type="text" class="form-control" name="description" value="{{ category[2] or '' }}"></div>
    <button type="submit" class="btn btn-primary">Update Category</button>
    <a href="/view-categories" class="btn btn-outline-primary">Cancel</a>
</form>
</div>
{% endblock %}
