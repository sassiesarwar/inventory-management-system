{% extends "base.html" %}
{% block content %}
<h2>Add New Product</h2>
<div class="card shadow-sm p-4" style="max-width: 500px;">
<form method="POST">
    <div class="mb-3"><label class="form-label">Product Name</label>
    <input type="text" class="form-control" name="product_name" required></div>
    <div class="mb-3"><label class="form-label">SKU/Barcode</label>
    <input type="text" class="form-control" name="sku"></div>
    <div class="mb-3"><label class="form-label">Unit Price</label>
    <input type="number" step="0.01" class="form-control" name="unit_price" required></div>
    <div class="mb-3"><label class="form-label">Quantity in Stock</label>
    <input type="number" class="form-control" name="quantity_in_stock" required></div>
    <button type="submit" class="btn btn-primary">Add Product</button>
</form>
</div>
{% endblock %}
