{% extends "base.html" %}
{% block content %}
<h2>Add New Product</h2>
<p class="text-muted mb-3">Add a new item to your inventory.</p>
<div class="card p-4" style="max-width: 500px;">
<form method="POST">
    <div class="mb-3"><label class="form-label">Product Name</label>
    <input type="text" class="form-control" name="product_name" placeholder="e.g., Nimbus 2000" required minlength="3"></div>
    <div class="mb-3"><label class="form-label">SKU/Barcode</label>
    <input type="text" class="form-control" name="sku" placeholder="e.g., BRM-001 (must be unique)"></div>
    <div class="mb-3"><label class="form-label">Description</label>
    <textarea class="form-control" name="description" placeholder="Brief description (optional)" rows="2"></textarea></div>
    <div class="mb-3"><label class="form-label">Unit Price (Rs.)</label>
    <input type="number" step="0.01" min="0" class="form-control" name="unit_price" placeholder="e.g., 25000" required></div>
    <div class="mb-3"><label class="form-label">Quantity in Stock</label>
    <input type="number" min="0" class="form-control" name="quantity_in_stock" placeholder="e.g., 20" required></div>
    <button type="submit" class="btn btn-primary">Add Product</button>
    <a href="/view-products" class="btn btn-outline-primary">Cancel</a>
</form>
</div>
{% endblock %}
