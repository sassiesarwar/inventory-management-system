<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
</head>
<body>
    <h1>Add New Product</h1>
    <form action="/add-product" method="POST">
        <label>Product Name:</label><br>
        <input type="text" name="product_name" required><br><br>
        <label>SKU/Barcode:</label><br>
        <input type="text" name="sku"><br><br>
        <label>Unit Price:</label><br>
        <input type="number" step="0.01" name="unit_price" required><br><br>
        <label>Quantity in Stock:</label><br>
        <input type="number" name="quantity_in_stock" required><br><br>
        <button type="submit">Add Product</button>
    </form>
</body>
</html>
