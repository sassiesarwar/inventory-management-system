<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - InvenTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F7FA; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-card { background: white; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 40px 36px; width: 100%; max-width: 380px; text-align: center; }
        .form-control { border-radius: 8px; padding: 10px 14px; border: 1px solid #E2E8F0; margin-bottom: 14px; }
        .btn-login { background-color: #089BAB; color: white; border: none; border-radius: 8px; padding: 10px; width: 100%; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="font-size: 2.2rem;">🔒</div>
        <h5 class="mt-2">Reset Password</h5>
        <p class="text-muted" style="font-size: 0.88rem;">Contact your system administrator to reset your password.</p>
        <a href="/login" class="btn-login" style="display:block; text-decoration:none;">Back to Login</a>
    </div>
</body>
</html>
